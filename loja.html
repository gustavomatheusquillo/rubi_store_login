<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rubi Store</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ruby:#B80F3C;--bg:#FFF4F6;--surface:#FFFFFF;--ink:#3A0A18;--muted:#7A5560;--line:#EBCCD4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E0A10;--surface:#2A1019;--ink:#FBE9EE;--muted:#C9A3AF;--line:#4A2330;--ruby:#E0355F;color-scheme:dark}}
html{height:100%}*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5}
.top{background:var(--ruby);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Fraunces',Georgia,serif;font-size:24px}
.top button{background:none;border:1.5px solid #fff;color:#fff;border-radius:10px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px}
h1{font-family:'Fraunces',Georgia,serif;font-size:32px;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:20px}
.card p{margin:0;color:var(--muted)}
a{color:var(--ruby);font-weight:700}
</style>
</head>
<body>
<header class="top"><div class="logo">Rubi Store</div><button id="sair" type="button">Sair</button></header>
<main class="wrap">
  <h1 id="ola">Bem-vinda à Rubi Store</h1>
  <p style="color:var(--muted);margin:0">Seu cadastro está completo! Falta colocar o link da sua loja no arquivo config.js.</p>
  <div class="card" id="end" hidden>
    <strong>Entregamos em</strong>
    <p id="endtxt"></p>
    <p style="margin-top:10px"><a href="endereco.html">Alterar endereço</a></p>
  </div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyB2u4h080Yo69K_P7IvDhL-RPAFhG8I9as",
  authDomain: "rubi-store-login.firebaseapp.com",
  projectId: "rubi-store-login",
  storageBucket: "rubi-store-login.firebasestorage.app",
  messagingSenderId: "754795317608",
  appId: "1:754795317608:web:7c967b313313b731eeaedd",
  measurementId: "G-L135BYT0FK"
});
const auth = getAuth(app), db = getFirestore(app);
document.getElementById('sair').onclick = () => signOut(auth).then(() => { location.href = 'index.html'; });
onAuthStateChanged(auth, async user => {
  if (!user) { try { sessionStorage.setItem('rubiBounce','loja'); } catch (e) {} location.href = 'index.html'; return; }
  const d = (await getDoc(doc(db, 'users', user.uid))).data() || {};
  if (!d.endereco) { location.href = 'endereco.html'; return; }
  const n = (d.nome || user.displayName || '').split(' ')[0];
  if (n) document.getElementById('ola').textContent = 'Olá, ' + n + '!';
  const e = d.endereco;
  document.getElementById('endtxt').textContent = e.rua + ', ' + e.numero + (e.complemento ? ' - ' + e.complemento : '') + ' · ' + e.bairro + ' · ' + e.cidade + '/' + e.uf + ' · CEP ' + e.cep;
  document.getElementById('end').hidden = false;
});
</script>
</body>
</html>
